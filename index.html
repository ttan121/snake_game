<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Neon Edition</title>
    <style>
        /* GIỮ NGUYÊN CSS NHƯ CŨ */
        body {
            background-color: #1a1a1a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { margin: 10px 0; text-shadow: 0 0 10px #4dff4d; font-size: 2.5rem; }
        
        .game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
        }

        canvas {
            background-color: #000;
            border: 2px solid #333;
            border-radius: 10px;
            display: block;
            box-shadow: 0 0 20px rgba(77, 255, 77, 0.2);
        }

        .score-board { font-size: 1.5rem; margin-bottom: 10px; color: #ccc; }
        .score-val { color: #4dff4d; font-weight: bold; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s;
            z-index: 10;
        }

        #overlay h2 {
            font-size: 3rem;
            color: #ff4d4d;
            margin: 0 0 20px 0;
            text-shadow: 0 0 20px red;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #4dff4d;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            color: #000;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 0 15px #4dff4d;
        }

        button:hover { transform: scale(1.05); box-shadow: 0 0 25px #4dff4d; }
        button:active { transform: scale(0.95); }

        .hidden { visibility: hidden !important; opacity: 0 !important; }
    </style>
</head>
<body>

    <div class="score-board">Điểm: <span id="score" class="score-val">0</span></div>

    <div class="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div id="overlay">
            <h2 id="statusText" style="color: #4dff4d;">SNAKE GAME</h2>
            <button onclick="startGame()" id="playBtn">Chơi Ngay</button>
        </div>
    </div>

    <p style="margin-top: 20px; color: #666;">Dùng phím Mũi Tên ⬆️⬇️⬅️➡️ để di chuyển</p>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const overlay = document.getElementById('overlay');
        const statusText = document.getElementById('statusText');
        const playBtn = document.getElementById('playBtn'); // Lấy nút bấm

        const tileCount = 20;
        const tileSize = canvas.width / tileCount - 2;
        const speed = 7;

        let headX = 10;
        let headY = 10;
        let dx = 0;
        let dy = 0;
        let appleX = 5;
        let appleY = 5;
        let tail = [];
        let tailLength = 2;
        let score = 0;
        let gameLoop;
        let isRunning = false;

        function startGame() {
            headX = 10;
            headY = 10;
            tail = [];
            tailLength = 2;
            score = 0;
            dx = 0;
            dy = 0;
            scoreEl.innerText = score;
            isRunning = true;
            
            // Đặt lại chữ khi bắt đầu game mới (phòng khi người chơi F5)
            statusText.innerText = "SNAKE GAME";
            statusText.style.color = "#4dff4d";

            overlay.classList.add('hidden');
            generateApple();

            if (gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(drawGame, 1000 / speed);
        }

        function drawGame() {
            if (!isRunning) return;

            changeSnakePosition();
            
            let result = isGameOver();
            if (result) {
                gameOverScreen();
                return;
            }

            clearScreen();
            checkAppleCollision();
            drawApple();
            drawSnake();
        }

        function isGameOver() {
            let gameOver = false;

            // FIX LỖI 1: Nếu rắn chưa di chuyển (vừa ấn Start), không kiểm tra Game Over
            if (dx === 0 && dy === 0) {
                return false;
            }

            // Chạm tường
            if (headX < 0 || headX >= tileCount || headY < 0 || headY >= tileCount) {
                gameOver = true;
            }

            // Cắn đuôi
            for (let i = 0; i < tail.length; i++) {
                if (tail[i].x === headX && tail[i].y === headY) {
                    gameOver = true;
                    break;
                }
            }
            return gameOver;
        }

        function gameOverScreen() {
            isRunning = false;
            statusText.innerText = "GAME OVER";
            statusText.style.color = "#ff4d4d";
            
            // FIX LỖI 2: Đổi chữ nút bấm thành "Chơi Lại"
            playBtn.innerText = "Chơi Lại";
            
            overlay.classList.remove('hidden');
            clearInterval(gameLoop);
        }

        function clearScreen() {
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            for (let i = 0; i < tail.length; i++) {
                let colorVal = 255 - (i * 5); 
                if (colorVal < 50) colorVal = 50;
                ctx.fillStyle = i === tail.length - 1 ? '#4dff4d' : `rgb(0, ${colorVal}, 0)`; 
                
                if (i === tail.length - 1) {
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#4dff4d";
                } else {
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(tail[i].x * (canvas.width / tileCount), tail[i].y * (canvas.width / tileCount), tileSize, tileSize);
            }
            ctx.shadowBlur = 0;

            tail.push({ x: headX, y: headY });
            while (tail.length > tailLength) {
                tail.shift();
            }
        }

        function drawApple() {
            ctx.fillStyle = "#ff3333";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "red";
            let x = appleX * (canvas.width / tileCount);
            let y = appleY * (canvas.width / tileCount);
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.shadowBlur = 0;
        }

        function changeSnakePosition() {
            headX = headX + dx;
            headY = headY + dy;
        }

        function checkAppleCollision() {
            if (appleX === headX && appleY === headY) {
                appleX = Math.floor(Math.random() * tileCount);
                appleY = Math.floor(Math.random() * tileCount);
                tailLength++;
                score += 10;
                scoreEl.innerText = score;
            }
        }

        function generateApple() {
            appleX = Math.floor(Math.random() * tileCount);
            appleY = Math.floor(Math.random() * tileCount);
            for(let t of tail) {
                if(t.x === appleX && t.y === appleY) {
                    generateApple();
                    break;
                }
            }
        }

        document.body.addEventListener('keydown', keyDown);

        function keyDown(event) {
            // Ngăn cuộn trang
            if([37, 38, 39, 40].indexOf(event.keyCode) > -1) {
                event.preventDefault();
            }

            // Xử lý mũi tên
            if (event.keyCode == 38) { // Lên
                if (dy == 1) return;
                dy = -1; dx = 0;
            }
            if (event.keyCode == 40) { // Xuống
                if (dy == -1) return;
                dy = 1; dx = 0;
            }
            if (event.keyCode == 37) { // Trái
                if (dx == 1) return;
                dy = 0; dx = -1;
            }
            if (event.keyCode == 39) { // Phải
                if (dx == -1) return;
                dy = 0; dx = 1;
            }
        }
    </script>
</body>
</html>
